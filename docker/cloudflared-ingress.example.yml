# Add this hostname to the EXISTING tunnel on the PowerEdge (/etc/cloudflared/config.yml),
# above the catch-all rule. Do not create a second cloudflared service.
#
#   sudo nano /etc/cloudflared/config.yml
#   cloudflared tunnel route dns <TUNNEL_ID> lab.example.in
#   sudo cloudflared tunnel ingress validate
#   sudo systemctl restart cloudflared
#
ingress:
  # ... existing grantsetu.in / www / api rules stay as they are ...

  - hostname: lab.example.in          # replace with the real lab hostname
    service: http://localhost:8090    # = LAB_HTTP_PORT in .env

  - service: http_status:404          # catch-all must stay last
