# PowerEdge R730 (shared with GrantSetu, phytosynergy, tgma, mmilab), behind Cloudflare.
#   bash deploy.sh up       first start
#   bash deploy.sh update   after pushing from the laptop
# TLS is terminated by Cloudflare; the `tunnel` service below talks to nginx inside the
# compose network. nginx is also published on 127.0.0.1:${LAB_HTTP_PORT:-8090} for checks
# over SSH. Host ports 80/3000/7070/8000/8080/8082/8100 belong to other apps.
name: aarogyam

# Only `web` builds the image; the celery services reuse the same tag. Building it from
# three services at once races on the image export ("image already exists").
x-app: &app
  image: aarogyam-web:server
  env_file: .env
  environment:
    DEBUG: "False"
    USE_X_ACCEL_REDIRECT: "True"
    # Cloudflare already redirects http->https at the edge; Django sees
    # X-Forwarded-Proto=https from nginx, so this stays on safely.
    SECURE_SSL_REDIRECT: "True"
  volumes:
    - static_volume:/app/staticfiles
    - private_media:/app/private_media
    # Centre and doctor photos. Public by design - nginx serves it straight
    # from /media/ - so NOTHING patient-related may be written here.
    - public_media:/app/public_media
  depends_on:
    db: { condition: service_healthy }
    redis: { condition: service_started }
  restart: unless-stopped

services:
  db:
    image: postgres:16-alpine
    env_file: .env
    environment:
      TZ: Asia/Kolkata
    volumes:
      - pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--save", "", "--appendonly", "no"]
    restart: unless-stopped

  web:
    <<: *app
    build: .
    environment:
      DEBUG: "False"
      USE_X_ACCEL_REDIRECT: "True"
      SECURE_SSL_REDIRECT: "True"
      RUN_MIGRATIONS: "1"
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://localhost:8000/healthz')\""]
      interval: 15s
      timeout: 5s
      retries: 20
      start_period: 40s

  celery_worker:
    <<: *app
    command: ["celery", "-A", "config", "worker", "-l", "info", "--concurrency", "2"]

  celery_beat:
    <<: *app
    command: ["celery", "-A", "config", "beat", "-l", "info", "--schedule", "/tmp/celerybeat-schedule"]

  nginx:
    build: ./docker/nginx
    ports:
      - "127.0.0.1:${LAB_HTTP_PORT:-8090}:80"
    volumes:
      - ./docker/nginx/tunnel:/etc/nginx/templates:ro
      - static_volume:/app/staticfiles:ro
      - private_media:/app/private_media:ro
      - public_media:/app/public_media:ro
    depends_on:
      web: { condition: service_healthy }
    restart: unless-stopped

  # Public link: own Cloudflare tunnel (same pattern as phytosynergy-project).
  # Create the tunnel in Cloudflare Zero Trust -> Networks -> Tunnels, set its public
  # hostname's service to  http://nginx:80 , and put the token in .env as
  # CLOUDFLARE_TUNNEL_TOKEN. deploy.sh enables this profile only when the token is set.
  tunnel:
    # Same image the other stacks on this server already use (disk is tight).
    image: cloudflare/cloudflared:latest
    command: ["tunnel", "--no-autoupdate", "run"]
    environment:
      TUNNEL_TOKEN: ${CLOUDFLARE_TUNNEL_TOKEN:-}
    depends_on:
      - nginx
    profiles: ["tunnel"]
    restart: unless-stopped

  # Public link, TGMA-style: ngrok HTTPS tunnel to nginx. Enabled by deploy.sh when
  # NGROK_AUTHTOKEN is set in .env. Without NGROK_URL the address changes on every
  # restart (bash deploy.sh url prints it); set NGROK_URL to the account's free static
  # domain for a fixed link. Free ngrok accounts allow ONE online agent - the same
  # token cannot also run TGMA's ngrok container at the same time.
  ngrok:
    image: ngrok/ngrok:latest
    entrypoint: ["/bin/sh", "-c"]
    command: ["exec ngrok http nginx:80 --log=stdout $${NGROK_URL:+--url=$$NGROK_URL}"]
    environment:
      NGROK_AUTHTOKEN: ${NGROK_AUTHTOKEN:-}
      NGROK_URL: ${NGROK_URL:-}
    depends_on:
      - nginx
    profiles: ["ngrok"]
    restart: unless-stopped

  db_backup:
    build: ./docker/backup
    env_file: .env
    environment:
      TZ: Asia/Kolkata
    volumes:
      # Outside the project directory on purpose: a deleted checkout must not take the backups with it.
      - ${BACKUP_DIR:-/home/mmilab/aarogyam-backups}:/backups
    depends_on:
      db: { condition: service_healthy }
    restart: unless-stopped

volumes:
  pg_data:
  static_volume:
  private_media:
  public_media:
