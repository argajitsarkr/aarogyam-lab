# Production on a single Ubuntu VPS:
#   cp .env.example .env   # fill in real secrets
#   docker compose -f docker-compose.prod.yml up -d --build
# Requires a complete .env (see README). No source mounts, DEBUG off, HTTPS only.
# Only `web` builds the image; the celery services reuse the same tag.
x-app: &app
  image: aarogyam-web:prod
  env_file: .env
  environment:
    DEBUG: "False"
    USE_X_ACCEL_REDIRECT: "True"
  volumes:
    - static_volume:/app/staticfiles
    - private_media:/app/private_media
  depends_on:
    db: { condition: service_healthy }
    redis: { condition: service_started }
  restart: unless-stopped

services:
  db:
    image: postgres:16-alpine
    env_file: .env
    environment:
      TZ: Asia/Kolkata
    volumes:
      - pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--save", "", "--appendonly", "no"]
    restart: unless-stopped

  web:
    <<: *app
    build: .
    environment:
      DEBUG: "False"
      USE_X_ACCEL_REDIRECT: "True"
      RUN_MIGRATIONS: "1"
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://localhost:8000/healthz')\""]
      interval: 15s
      timeout: 5s
      retries: 20
      start_period: 40s

  celery_worker:
    <<: *app
    command: ["celery", "-A", "config", "worker", "-l", "info", "--concurrency", "2"]

  celery_beat:
    <<: *app
    command: ["celery", "-A", "config", "beat", "-l", "info", "--schedule", "/tmp/celerybeat-schedule"]

  nginx:
    build: ./docker/nginx
    environment:
      SERVER_NAME: ${SERVER_NAME}
      SSL_CERT: /etc/letsencrypt/live/${SERVER_NAME}/fullchain.pem
      SSL_KEY: /etc/letsencrypt/live/${SERVER_NAME}/privkey.pem
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - static_volume:/app/staticfiles:ro
      - private_media:/app/private_media:ro
      - letsencrypt:/etc/letsencrypt
      - certbot_www:/var/www/certbot
    depends_on:
      web: { condition: service_healthy }
    restart: unless-stopped

  # Renews Let's Encrypt certificates twice a day (first issue: see README).
  certbot:
    image: certbot/certbot:v2.11.0
    volumes:
      - letsencrypt:/etc/letsencrypt
      - certbot_www:/var/www/certbot
    entrypoint: ["/bin/sh", "-c", "trap exit TERM; while :; do certbot renew --webroot -w /var/www/certbot --quiet; sleep 12h & wait $${!}; done"]
    restart: unless-stopped

  db_backup:
    build: ./docker/backup
    env_file: .env
    environment:
      TZ: Asia/Kolkata
    volumes:
      - ./backups:/backups
    depends_on:
      db: { condition: service_healthy }
    restart: unless-stopped

volumes:
  pg_data:
  static_volume:
  private_media:
  letsencrypt:
  certbot_www:
