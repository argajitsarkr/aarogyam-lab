{% extends "auth_base.html" %}
{% block content %}
<form method="post" class="space-y-3">
  {% csrf_token %}
  {% for m in messages %}<div class="rounded-md bg-teal-50 p-2 text-sm text-teal-800">{{ m }}</div>{% endfor %}
  {% if form.non_field_errors %}<div class="rounded-md bg-red-50 p-2 text-sm text-red-700">{{ form.non_field_errors|striptags }}</div>{% endif %}
  <div><label class="label" for="id_username">Username or email</label>
    <input class="input" type="text" name="username" id="id_username" autofocus autocomplete="username" required value="{{ form.username.value|default:'' }}"></div>
  <div><label class="label" for="id_password">Password</label>
    <input class="input" type="password" name="password" id="id_password" autocomplete="current-password" required></div>
  <input type="hidden" name="next" value="{{ next }}">
  <button class="btn-primary w-full py-2.5">Sign in</button>
  <p class="text-center text-xs text-slate-500">Forgot your password, or locked out? Ask the site administrator to reset it.</p>
</form>
{% endblock %}
