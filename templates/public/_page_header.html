{% comment %}
  The band under the nav on every inner page: title, one line of context, and
  nothing else. Keeps the inner pages from each inventing their own heading.
{% endcomment %}
<section class="border-b border-slate-200 bg-slate-50">
  <div class="mx-auto max-w-7xl px-4 py-8">
    <h1 class="pub-h1">{{ header_title }}</h1>
    {% if header_subtitle %}<p class="pub-lead mt-2 max-w-3xl">{{ header_subtitle }}</p>{% endif %}
  </div>
</section>
