{# Generic filter bar: live-updates results via HTMX #}
<form id="filters" method="get" class="card mb-3 grid grid-cols-2 gap-2 p-3 sm:grid-cols-3 lg:grid-cols-6"
      hx-get="{{ request.path }}" hx-target="#list-results" hx-push-url="true"
      hx-trigger="input changed delay:400ms from:input, change from:select">
  <input type="hidden" name="view" value="{{ view_mode }}">
  {% for field in filter.form %}
    <div class="{% if field.name == 'q' %}col-span-2{% endif %}">
      <label class="mb-0.5 block text-xs text-slate-500" for="{{ field.id_for_label }}">{{ field.label }}</label>
      {{ field }}
    </div>
  {% endfor %}
  <div class="col-span-2 flex items-end gap-2 sm:col-span-1">
    <a href="{{ request.path }}" class="btn btn-sm">Reset</a>
    <span class="htmx-indicator text-xs text-slate-500">Loading…</span>
  </div>
</form>
