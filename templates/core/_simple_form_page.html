{% extends "base.html" %}
{% block title %}{{ page_heading }}{% endblock %}{% block page_title %}{{ page_heading }}{% endblock %}
{% block content %}
<form method="post" enctype="multipart/form-data" class="card mx-auto max-w-3xl" autocomplete="off">
  {% csrf_token %}
  {% include "core/_form_fields.html" %}
  {% if help_note %}<p class="mt-3 text-xs text-slate-500">{{ help_note }}</p>{% endif %}
  <div class="mt-4 flex justify-end gap-2"><a href="{{ cancel_url|default:'javascript:history.back()' }}" class="btn">Cancel</a><button class="btn-primary">Save</button></div>
</form>
{% endblock %}
