{% extends "base.html" %}
{% block title %}Access denied{% endblock %}
{% block content %}
<div class="card mx-auto mt-10 max-w-lg text-center">
  <div class="text-4xl">🔒</div>
  <h1 class="mt-2 text-xl font-semibold">Access denied</h1>
  <p class="mt-2 text-sm text-slate-600">{{ reason|default:"You do not have permission to view this page." }}</p>
  <p class="mt-1 text-xs text-slate-500">This attempt has been recorded in the audit log.</p>
  <a href="{% url 'dashboard:home' %}" class="btn-primary mt-4">Back to dashboard</a>
</div>
{% endblock %}
